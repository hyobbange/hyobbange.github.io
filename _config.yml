# GitHub Pages(Jekyll) 설정. 푸시하면 GitHub가 main 브랜치를 그대로 빌드·배포한다.
title: HFX Lab
url: https://hfx.kr  # og:image 등 절대 주소에 쓰임
description: Small games and apps by HFX Lab.
contact_email: hfx.lab@gmail.com
lang: en
markdown: kramdown
exclude:
  - CLAUDE.md
  - README.md
  - docs/

# 개인정보처리방침·이용약관 버전 문서. _policies/<문서>/<언어>/<시행일>.md → /<문서>/<언어>/<시행일>/
collections:
  policies:
    output: true
    permalink: /:path/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: policies }
    values: { layout: policy }
