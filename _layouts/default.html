<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title %}{% assign full_title = page.title | append: " · " | append: site.title %}{% else %}{% assign full_title = site.title %}{% endif %}
  <title>{{ full_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ full_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">HFX Lab</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Apps</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    </nav>
  </header>
  <main class="content">
{{ content }}
  </main>
  <footer class="site-footer">
    <p>© 2023 HFX Lab · <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a> · <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a></p>
  </footer>
</body>
</html>
